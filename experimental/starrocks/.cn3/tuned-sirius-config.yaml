# Engine A tuned config — variant: t-b8-r32
# batch=8GB  reactors=32
sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      usage_limit_bytes: "140GiB"
      reservation_limit_fraction: 1.0
      downgrade_trigger_fraction: 0.9
      downgrade_stop_fraction: 0.85
    host:
      capacity_bytes: "160GiB"
      initial_number_pools: 143
      pool_size: 8
      block_size: 67108864
  executor:
    scan_manager:
      memory_prefetcher:
        enable: true
        num_threads: 3
      num_threads: 18
      use_sirius_datasource: true
      uring_n_reactors: 32
      enable_prefetch_cache: false
    pipeline:
      num_threads: 8
    downgrade:
      num_threads: 1
    task_creator:
      num_threads: 4
  operator_params:
    scan_task_batch_size: 8GB
    max_sort_partition_bytes: 0
    hash_partition_bytes: 32GB
    concat_batch_bytes: 5GB
    max_build_hash_table_bytes: 32GB
  telemetry:
    enable_quent: false
    output_directory: ".cn3/telemetry"
    engine_name: siriusDB
